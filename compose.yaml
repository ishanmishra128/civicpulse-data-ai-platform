services:
  postgres:
    image: postgres:17
    container_name: civicpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: civicpulse
      POSTGRES_USER: civicpulse
      POSTGRES_PASSWORD: civicpulse_local_dev
    ports:
      - "5050:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicpulse -d civicpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
